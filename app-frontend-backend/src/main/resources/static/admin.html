<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administrator Panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <nav class="topnav">
      <a href="/guest.html" class="btn secondary">Back</a>
      <span class="muted">Administrator Panel</span>
      <span id="accountBadge" class="accountBadge hidden"></span>
    </nav>

    <section class="card">
      <div class="row headerRow">
        <h2>Table Plan</h2>
        <div class="actions">
          <button id="prevDayBtn" class="btn secondary" type="button">&lt;</button>
          <input id="adminDate" type="date" required />
          <button id="nextDayBtn" class="btn secondary" type="button">&gt;</button>
        </div>
      </div>
      <div id="adminMsg" class="result"></div>
      <div id="tablesGrid" class="tablesGrid tablePlan"></div>
      <p class="muted">Click a table to filter. Click the same table again to clear the filter.</p>
    </section>

    <section class="card">
      <div class="row headerRow">
        <h2>Reservations for the Day</h2>
      </div>
      <div id="reservationsList" class="list"></div>
    </section>
  </main>

  <script src="core.js"></script>
  <script src="public-pages.js"></script>
  <script src="admin-page.js"></script>
  <script src="app.js"></script>
</body>
</html>
