<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Reservations - Guest Panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <nav class="topnav">
      <a id="guestBackBtn" href="/" class="btn secondary">Back</a>
      <span class="muted">Guest Panel</span>
      <span id="accountBadge" class="accountBadge hidden"></span>
    </nav>

    <section class="grid3">
      <a class="card linkcard" href="/edit.html">
        <h2>Edit Reservation</h2>
        <p>Update details, date, time, or cancel.</p>
