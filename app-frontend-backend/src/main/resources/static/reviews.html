<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reviews</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <nav class="topnav">
      <a href="/guest.html" class="btn secondary">Back</a>
      <span class="muted">Reviews</span>
    </nav>

    <section class="card">
      <h2>Add Review</h2>
      <form id="reviewForm" class="form">
        <div class="row">
          <label>Rating (1-5)
            <input name="rate" type="number" min="1" max="5" value="5" required />
          </label>
          <label>Description
            <input name="description" placeholder="Short and to the point" />
          </label>
        </div>
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div id="reviewMsg" class="result"></div>
    </section>

    <section class="card">
      <h2>Review List</h2>
      <div id="reviewsList" class="list"></div>
    </section>
  </main>

  <script src="core.js"></script>
  <script src="public-pages.js"></script>
  <script src="admin-page.js"></script>
  <script src="app.js"></script>
</body>
</html>
