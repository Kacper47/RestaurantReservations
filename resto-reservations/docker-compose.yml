services:
  mysql:
    image: mysql:8.0
    container_name: resto-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: resto
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

